name: ReqRes API Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Newman
        run: npm install -g newman

      - name: Check ReqRes API
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          node - <<'JS'
          const newman = require('/usr/local/lib/node_modules/newman');

          const apiKey = process.env.REQRES_API_KEY;

          if (!apiKey) {
            console.error('Missing REQRES_API_KEY');
            process.exit(1);
          }

          const collection = {
            info: {
              name: 'ReqRes Monitor',
              schema: 'https://schema.getpostman.com/json/collection/v2.1.0/collection.json'
            },
            item: [{
              name: 'GET Users Page 1',
              request: {
                method: 'GET',
                header: [
                  { key: 'x-api-key', value: '{{apiKey}}' }
                ],
                url: 'https://reqres.in/api/users?page=1'
              },
              event: [{
                listen: 'test',
                script: {
                  exec: [
                    'pm.test("Status Code is 200", function () {',
                    '  pm.response.to.have.status(200);',
                    '});',
                    'pm.test("Response Time below 800ms", function () {',
                    '  pm.expect(pm.response.responseTime).to.be.below(800);',
                    '});'
                  ]
                }
              }]
            }]
          };

          newman.run({
            collection,
            envVar: [{ key: 'apiKey', value: apiKey }],
            reporters: 'cli'
          }, function (err, summary) {
            if (err || summary.run.failures.length > 0) {
              console.error('Monitor FAILED');
              process.exitCode = 1;
            } else {
              console.log('Monitor PASSED');
            }
          });
          JS
