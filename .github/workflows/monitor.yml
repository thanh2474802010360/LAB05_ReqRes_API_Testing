name: ReqRes API Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check ReqRes API
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import time
          import urllib.request
          import urllib.error

          url = "https://reqres.in/api/users?page=1"

          headers = {
              "x-api-key": os.environ.get("REQRES_API_KEY", ""),
              "Accept": "application/json"
          }

          request = urllib.request.Request(url, headers=headers)

          start = time.perf_counter()

          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  status = response.status
                  body = response.read().decode("utf-8", errors="replace")
          except urllib.error.HTTPError as error:
              status = error.code
              body = error.read().decode("utf-8", errors="replace")

          elapsed = (time.perf_counter() - start) * 1000

          print("Status Code:", status)
          print(f"Response Time: {elapsed:.2f} ms")

          if status != 200:
              print("API Error:", body[:1000])

          assert status == 200, "API status must be 200"
          assert elapsed < 800, "Response time must be below 800ms"

          print("Monitor PASSED")
          PY
