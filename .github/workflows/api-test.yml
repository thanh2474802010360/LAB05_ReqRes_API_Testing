name: ReqRes API Testing

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Run API Tests
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          newman run ReqRes_Collection.json \
            -e ReqRes_Environment.json \
            -d users.csv \
            --env-var "baseUrl=https://reqres.in" \
            --env-var "apiKey=$REQRES_API_KEY" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export report.html
      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReqRes-Test-Report
          path: report.html
          if-no-files-found: warn
